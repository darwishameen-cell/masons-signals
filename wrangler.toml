name = "masons-signals"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "masons-signals"
database_id = "a6c9a4e4-b6ec-4a99-b7cc-e0621434b327"
migrations_dir = "migrations"

[ai]
binding = "AI"

[assets]
directory = "./site"

# Request-level rate limit, enforced at the edge before the handler runs.
# The per-IP signup counter in D1 protects list quality; this protects cost,
# because requests that never insert a row (duplicates, bad domains) do not
# increment that counter.
[[unsafe.bindings]]
name = "SUBSCRIBE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[triggers]
crons = ["*/15 * * * *"]

[vars]
DRY_RUN = "true"
SITE_ORIGIN = "https://masonssignals.com"
FROM_EMAIL = "Mason's Signals <noreply@masonssignals.com>"
# TEST_INBOX is a Worker secret. While DRY_RUN is "true", every email is
# redirected there instead of to the requested subscriber. See SETUP.md.
